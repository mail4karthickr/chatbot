# Mirrors the vite dev-server proxy (vite.config.ts): the browser calls
# relative paths; nginx forwards /chat to the agent service container.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chat responses may stream — unbuffered, long-lived connection.
    location /chat {
        proxy_pass http://agent-service:8001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
