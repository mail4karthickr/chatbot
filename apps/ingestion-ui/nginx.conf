# Mirrors the vite dev-server proxy (vite.config.ts): the browser calls
# relative paths; nginx forwards API routes to the ingestion service container.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(s3|ingest|reset|retrieve|generate|parse-preview) {
        proxy_pass http://ingestion-api:8000;
        proxy_set_header Host $host;
    }

    # SSE stream — must pass chunks through unbuffered, on a long-lived
    # connection (same reason vite.config.ts calls this route out).
    location /events {
        proxy_pass http://ingestion-api:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
